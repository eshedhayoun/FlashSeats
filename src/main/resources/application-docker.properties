# The cluster profile discovers Redis through Sentinel rather than pinning the
# application to the current primary. Local/dev and test remain standalone.
spring.data.redis.sentinel.master=${SPRING_DATA_REDIS_SENTINEL_MASTER:flashseats}
spring.data.redis.sentinel.nodes=${SPRING_DATA_REDIS_SENTINEL_NODES:redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
