spring.application.name=flashseats

# The dev profile seeds a walkable sale on an empty database (CatalogDevSeeder).
# compose.yaml overrides this with SPRING_PROFILES_ACTIVE=docker.
spring.profiles.active=dev

# --- Java 21 virtual threads -------------------------------------------------
# Load-bearing. Requests and long-lived SSE connections ride virtual threads
# rather than pooled OS threads. See docs/05-global-standards.md section 7 for
# the pinning rules that come with this: on JDK 21 a `synchronized` block pins
# the carrier thread (JEP 491 only fixes this in JDK 24), so our own code uses
# ReentrantLock.
spring.threads.virtual.enabled=true

# --- Datasource --------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/flashseats
spring.datasource.username=flashseats
spring.datasource.password=flashseats
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# With virtual threads the connection pool becomes the real concurrency limit:
# unbounded virtual threads queue on Hikari rather than on the web container.
# Size it deliberately and watch hikaricp_connections_pending.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=10000

# --- Flyway ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Actuator ----------------------------------------------------------------
# /actuator/health is the container healthcheck target in Dockerfile,
# compose.yaml and nginx.conf. Do not disable it.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=flashseats

# --- Flash-sale tunables (docs/03-end-to-end-flow.md section 6) ---------------
# Three nested timers: queue pass -> admission session -> hold (ADR-020).
flashseats.queue.pass-ttl-seconds=120
flashseats.queue.admission-ttl-seconds=600
flashseats.queue.promotion-interval-ms=1000
# ADR-028: promotion-batch-size <= hikari.maximum-pool-size x 1.5. Admission
# control bounds admission by INVENTORY; this bounds it by CAPACITY TO SERVE.
# They are different limits and both apply. Changing one without the other is a
# configuration error: under virtual threads nothing errors, requests simply
# queue on HikariCP while p99 collapses. Alarm on hikaricp_connections_pending.
flashseats.queue.promotion-batch-size=45
flashseats.queue.sse-position-interval-ms=2000
flashseats.queue.sse-heartbeat-ms=15000
# Waiting rooms oversubscribe: hold-to-order conversion is well under 100%,
# so admitting exactly `remainingStock` people under-fills the sale (ADR-020).
flashseats.queue.oversubscribe-factor=1.5
# ADR-036: every key this module owns expires; none is deleted by the app.
# Deleting a live waiting room cannot be undone, and the condition that seemed
# to justify it (a zero stock read) is routinely wrong a second later.
flashseats.queue.key-retention-after-sale-seconds=3600
# NOTE: queue ordering is FIFO by arrival millisecond. `flashseats.queue.ordering`
# was declared here with no backing field and was silently ignored; the RANDOM
# draw arrives with ADR-024 and brings the property with it.

flashseats.hold.ttl-seconds=300
flashseats.hold.grace-seconds=120
flashseats.hold.max-ttl-seconds=420
flashseats.hold.max-quantity=6
flashseats.hold.sweeper-interval-ms=10000

flashseats.order.checkout-grace-minutes=15
flashseats.order.max-payment-attempts=3
# ADR-030: a retry submitted with less time than this left returns 409 rather
# than starting a charge that cannot finish inside the hold window.
flashseats.order.min-remaining-seconds-for-retry=45
# ADR-034: PENDING is in-flight, never terminal. Past this, no charge can still
# be running, so a retry resumes the order instead of being refused forever.
# Tracks flashseats.payment.inflight-ttl-seconds; never set it lower.
flashseats.order.stale-pending-seconds=90
flashseats.order.receipt-secret=${FLASHSEATS_SESSION_SECRET:dev-only-change-me}

flashseats.outbox.poll-interval-ms=1000
flashseats.outbox.batch-size=100
# A row claimed but never published (a crash between the claim and the publish)
# is returned to PENDING after this long. At-least-once, which the consumer's
# unique constraint absorbs.
flashseats.outbox.stale-claim-seconds=60

# --- catalog -----------------------------------------------------------------
# ADR-027: public availability is a BUCKET, never a count. Exact live inventory
# drives panic-buying and hands scalpers a free feed.
flashseats.catalog.limited-threshold-percent=10

# --- bot ---------------------------------------------------------------------
flashseats.bot.session-secret=${FLASHSEATS_SESSION_SECRET:dev-only-change-me}
# A `Secure` cookie is silently dropped over plain HTTP. Left false so the local
# stack works; set true wherever the app is served over TLS.
flashseats.bot.cookie.secure=false
flashseats.bot.session-bucket.capacity=20
flashseats.bot.session-bucket.refill-per-second=10
# ADR-011: the IP bucket is a coarse flood backstop, NOT the primary control.
# Thousands of legitimate buyers share one carrier-grade NAT during exactly the
# spike this system exists to serve.
flashseats.bot.ip-bucket.capacity=300
flashseats.bot.ip-bucket.refill-per-second=150

# --- queue -------------------------------------------------------------------
flashseats.queue.pass-secret=${FLASHSEATS_QUEUE_PASS_SECRET:dev-only-change-me}
# ADR-026: advisory only. NEVER used for eviction — a Wi-Fi to cellular handover
# routinely outlasts any heartbeat TTL, and evicting on it deletes live buyers
# from the line through no fault of their own.
flashseats.queue.heartbeat-ttl-seconds=90

# --- payment -----------------------------------------------------------------
flashseats.payment.inflight-ttl-seconds=90

# --- admin (HTTP Basic on /api/v1/admin/**) ----------------------------------
flashseats.admin.username=admin
flashseats.admin.password=admin

# --- Redis -------------------------------------------------------------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# --- RabbitMQ ----------------------------------------------------------------
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:flashseats}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:flashseats}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# --- Mail (Mailpit locally; UI on :8025) -------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
flashseats.mail.from=tickets@flashseats.dev

# --- OpenAPI -----------------------------------------------------------------
springdoc.swagger-ui.path=/docs

# --- notification ------------------------------------------------------------
# Fulfilment needs a broker and an SMTP relay. Turning it off leaves the rest of
# the system fully functional: orders still commit and outbox rows still queue,
# they simply are not delivered until a replica with it enabled drains them.
flashseats.notification.enabled=true
