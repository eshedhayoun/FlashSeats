spring.application.name=flashseats

# --- Java 21 virtual threads -------------------------------------------------
# Load-bearing. The whole concurrency model assumes requests and long-lived SSE
# connections are carried on virtual threads rather than pooled OS threads.
spring.threads.virtual.enabled=true

# --- Datasource --------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/flashseats
spring.datasource.username=flashseats
spring.datasource.password=flashseats
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flash-sale tunables (docs/03-end-to-end-flow.md section 6) ---------------
flashseats.hold.ttl-seconds=300
flashseats.hold.grace-seconds=120
flashseats.hold.max-ttl-seconds=420
flashseats.hold.max-quantity=6
flashseats.hold.sweeper-interval-ms=10000

flashseats.queue.pass-ttl-seconds=120
flashseats.queue.promotion-interval-ms=1000
flashseats.queue.promotion-batch-size=50
flashseats.queue.sse-position-interval-ms=2000
flashseats.queue.sse-heartbeat-ms=15000

flashseats.order.checkout-grace-minutes=15
flashseats.order.max-payment-attempts=3

flashseats.outbox.poll-interval-ms=1000
flashseats.outbox.batch-size=100

# --- OpenAPI -----------------------------------------------------------------
springdoc.swagger-ui.path=/docs
