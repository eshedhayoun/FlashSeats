# Read by Spring's SpringProperties at test time. Only for settings that must be in place before any
# ApplicationContext exists, which is why this is not in application-test.properties.
#
# Spring Framework 7 PAUSES a cached test context whenever a test class switches to a different one.
# It stops that context's Lifecycle beans, then restarts them when a later class uses it again. This
# suite has several contexts (BotDefenceIT, RecaptchaFailOpenIT and NotificationListenerIT each
# create their own). After one of those runs, the shared context comes back unable to serve: every
# /queue request gets a bare 500 that never reaches even a highest-precedence servlet filter. That
# was the order-dependent failure in 06-mvp-overview.md section 9. Three classes reproduce it
# (HoldLifecycleIT, NotificationListenerIT, CheckoutRecoveryIT), and this line fixes it.
#
# NEVER keeps every cached context running. That was Spring 6's behaviour, and it is what this suite
# was written against. The cost is that a cached context keeps running its schedulers against its
# own containers. They are separate containers, because Testcontainers reuse is not enabled.
spring.test.context.cache.pause=never
