# Test profile.
#
# Containers supply the datasource and Redis via @ServiceConnection. Everything
# here either removes a moving part the tests do not exercise, or makes timing
# fast enough to assert on without making it unrealistic.

# No dev seed data: every test builds exactly the fixture it needs.

# The broker is not part of these tests, but the relay still runs end to end —
# claim, publish, mark — which is what lets the three-transaction shape be
# verified without RabbitMQ in the picture.
flashseats.outbox.transport=log

# Fulfilment needs a broker and an SMTP relay; neither is part of these tests.
# Turning it off is the same switch a traffic-only replica would use, so nothing
# here is a test-only code path.
flashseats.notification.enabled=false

# Real workers, faster clocks. Tests wait for the genuine scheduled path rather
# than reaching past it into internals — a promotion that only happens because a
# test called the worker directly proves less than one that simply happens.
flashseats.queue.promotion-interval-ms=200
flashseats.hold.sweeper-interval-ms=500
flashseats.outbox.poll-interval-ms=500
flashseats.queue.sse-position-interval-ms=3600000
flashseats.queue.sse-heartbeat-ms=3600000

# Deterministic secrets, so a token minted in one place verifies in another.
flashseats.bot.session-secret=test-session-secret
flashseats.queue.pass-secret=test-queue-secret
flashseats.order.receipt-secret=test-receipt-secret

logging.level.org.hibernate.SQL=off
logging.level.org.springframework.web=warn
