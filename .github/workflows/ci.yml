name: CI

on:
  pull_request:
  push:
    branches: [main, preview]
  workflow_dispatch:

# Read-only token: the jobs only check out and test.
permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main and preview always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit and integration tests. Testcontainers starts PostgreSQL, Redis and RabbitMQ on the
      # runner's Docker; the test profile uses the stub gateway, so no secrets are needed.
      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Type check the browser suite
        run: npm run typecheck:e2e
