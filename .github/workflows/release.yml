name: Release

# Continuous delivery. Every commit on main that passes CI is published to GitHub Container
# Registry as two images. A version tag (v1.2.3) promotes the images already built for its commit
# rather than rebuilding them, so a release is exactly what CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    # Only a successful CI run for a push to main; never a pull request's run.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: flashseats-app
            dockerfile: Dockerfile
          - image: flashseats-web
            dockerfile: docker/nginx/Dockerfile
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The commit CI tested, not whatever main points to now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  promote:
    name: Promote ${{ matrix.image }} to ${{ github.ref_name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [flashseats-app, flashseats-web]
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image built for this commit
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          image="${IMAGE,,}"
          source="${image}:sha-${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$source" > /dev/null; then
            echo "::error::${source} does not exist. Tag a commit on main that CI passed and Release published."
            exit 1
          fi
          docker buildx imagetools create --tag "${image}:${VERSION#v}" "$source"
