# FlashSeats — Nginx load balancer
#
# Two things here are correctness requirements rather than tuning:
#   * SSE must not be buffered (ADR-007) — buffered position updates make the
#     waiting room look frozen, and the promotion frame arrives late or never.
#   * worker_connections must be sized for concurrent SSE connections, which are
#     long-lived. The 1024 default is exhausted by ~500 waiting users.

user  nginx;
worker_processes auto;

# 10k waiting users = 10k held connections upstream + 10k downstream.
worker_rlimit_nofile 65536;

events {
    worker_connections 20480;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format flashseats '$remote_addr $upstream_addr $status '
                          '"$request" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log flashseats;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;
    server_tokens   off;

    # ---------------------------------------------------------------------
    # Upstream
    # ---------------------------------------------------------------------
    # least_conn, NOT round-robin. SSE connections are long-lived and wildly
    # uneven in duration; round-robin would keep handing new streams to a
    # replica that is already holding thousands of open ones.
    upstream flashseats_app {
        least_conn;
        server app-1:8080 max_fails=3 fail_timeout=10s;
        server app-2:8080 max_fails=3 fail_timeout=10s;
        server app-3:8080 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server backlog=8192;
        server_name _;

        # The bot module rate-limits on client IP, so the real one must survive
        # the hop. Spring must be told to trust it:
        #   server.forward-headers-strategy=framework
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # -----------------------------------------------------------------
        # SSE — the virtual waiting room stream  (ADR-007)
        # -----------------------------------------------------------------
        location = /api/v1/queue/stream {
            proxy_pass http://flashseats_app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";      # no upstream keepalive header

            # THE critical block. With buffering on, Nginx accumulates
            # position-update frames and flushes them in chunks: the user sees
            # a frozen counter, then a burst. The queue-promoted frame — which
            # is time-critical, the pass expires in 120s — arrives late.
            proxy_buffering    off;
            proxy_cache        off;
            gzip               off;
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no always;

            # A queue wait can legitimately last an hour. Default 60s read
            # timeout would sever every stream once a minute.
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 5s;
        }

        # -----------------------------------------------------------------
        # Everything else
        # -----------------------------------------------------------------
        location /api/ {
            proxy_pass http://flashseats_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Stripe webhooks: never retry upstream. A replayed POST is safe
        # (webhook_events dedupes on stripe_event_id) but pointless — Stripe
        # redelivers on any non-2xx, and it does so more patiently than we should.
        location = /api/v1/payments/webhook {
            proxy_pass http://flashseats_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_read_timeout 10s;
        }

        location /actuator/health {
            proxy_pass http://flashseats_app;
            access_log off;
        }

        location /docs {
            proxy_pass http://flashseats_app;
        }

        location = /nginx-health {
            return 200 'ok';
            add_header Content-Type text/plain;
            access_log off;
        }
    }
}
