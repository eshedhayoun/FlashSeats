# FlashSeats — the header set every proxied location must send.
#
# THIS FILE EXISTS BECAUSE OF AN INHERITANCE RULE THAT COSTS A WHOLE CLUSTER.
# nginx does not merge `proxy_set_header`: a directive at one level REPLACES the
# entire set inherited from above. These headers were declared once in the
# `server` block, and every location that added its own `proxy_set_header
# Connection ""` — the SSE stream, /api/, and the webhook — silently discarded
# all of them.
#
# Two consequences, and the first one hides the second:
#
#   * With no `Host`, nginx defaults to `$proxy_host`, which is the upstream
#     name `flashseats_app`. Tomcat rejects it — "The character [_] is never
#     valid in a domain name" — so EVERY proxied API request answered a bare
#     HTML 400 before Spring ever saw it.
#   * With no `X-Forwarded-For`, the rate limiter has no client address to read
#     even when nginx is correctly listed in FLASHSEATS_TRUSTED_PROXIES, so all
#     ten thousand buyers share nginx's single IP bucket (ADR-039, ADR-047).
#
# Included rather than repeated so the set cannot drift between locations, and
# so adding a location cannot quietly reintroduce either failure.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Empty, not absent: this clears the client's Connection header so it is not
# forwarded upstream, which is what lets the keepalive pool work.
proxy_set_header Connection        "";
