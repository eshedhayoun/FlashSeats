# FlashSeats — Redis 7 configuration
#
# Three settings here are load-bearing correctness requirements, not tuning knobs.
# See docs/00-architecture-decisions.md (ADR-003, ADR-004).

# ---------------------------------------------------------------------------
# 1. NEVER EVICT  (ADR-004)
# ---------------------------------------------------------------------------
# catalog:stock:{eventId}:{tierId} is written with TTL = -1, but a TTL of -1 does
# NOT protect a key from an LRU/LFU eviction policy. If Redis evicts a stock
# counter mid-sale the reserve script sees a missing key, and every subsequent
# hold fails with 503 until an operator runs a rebuild.
#
# noeviction makes Redis return an OOM error on writes instead of silently
# discarding inventory state. Failing loudly is the correct behaviour here.
maxmemory 1gb
maxmemory-policy noeviction

# ---------------------------------------------------------------------------
# 2. KEYSPACE EXPIRY NOTIFICATIONS  (ADR-003)
# ---------------------------------------------------------------------------
# The hold module listens on __keyevent@0__:expired to learn that hold:{token}
# has expired, and needs the MESSAGE to be the key name.
#
#   E = key-EVENT channels  -> __keyevent@<db>__:<event>, message = key name   <-- what we need
#   K = KEYSPACE channels   -> __keyspace@<db>__:<key>,   message = event name
#   x = expired events
#
# So the correct value is "Ex". ("Kx" would publish to the wrong channel with
# the wrong payload — the listener would never fire.)
#
# Note this is an at-most-once pub/sub delivery: a disconnected or restarting
# replica loses the event permanently. HoldReconciliationSweeper is what makes
# expiry correct; this listener only makes it fast.
notify-keyspace-events Ex

# ---------------------------------------------------------------------------
# 3. DURABILITY  (ADR-004)
# ---------------------------------------------------------------------------
# AOF everysec can lose up to one second of DECRBYs on an unclean shutdown,
# which reads back as inventory that does not exist. A stock reconciliation
# pass is MANDATORY after any Redis restart — see catalog rebuild procedure.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as a secondary safety net
save 900 1
save 300 10
save 60 10000

# ---------------------------------------------------------------------------
# Networking / limits
# ---------------------------------------------------------------------------
# DEV ONLY. Redis is reachable without auth on the compose network. For any
# deployed environment set `requirepass`, drop `protected-mode no`, and do not
# publish the port on the host.
bind 0.0.0.0
protected-mode no
tcp-keepalive 60
timeout 0

# Sized for the flash-sale spike: app replicas hold connection pools and the
# promotion pub/sub subscription on top of ordinary command traffic.
maxclients 10000

# ---------------------------------------------------------------------------
# Lua
# ---------------------------------------------------------------------------
# hold_reserve.lua is O(1). If a script ever runs longer than this something is
# badly wrong and we want it killed rather than blocking the single-threaded
# command loop during a sale.
busy-reply-threshold 5000

loglevel notice
